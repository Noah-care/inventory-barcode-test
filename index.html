<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JANコード在庫登録</title>


  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 18px;

      min-height: 28px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;

    }

  </style>

</head>


<body>


  <h1>
    JANコード在庫登録
  </h1>


  <div id="status">
    起動準備中...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // =====================================================
    // HTML要素
    // =====================================================

    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    // =====================================================
    // Apps Script Webアプリ
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyErStqYsz6WsJw7VvZFYyBr3DAYlOyDSAcX7oTLgvQMz4JLLHKTgCaiafm4CnxE1Pr/exec";


    // =====================================================
    // 状態
    // =====================================================

    let currentJanCode = "";

    let scanner = null;

    let isScanning = false;

    let lastJanCode = "";

    let lastScanTime = 0;


    // 同じJANを連続して読まないための時間

    const DUPLICATE_WAIT =
      3000;


    // =====================================================
    // JANコードをApps Scriptへ送信
    // =====================================================

    function registerJanCode(janCode) {


      console.log(
        "DB登録開始：",
        janCode
      );


      // ---------------------------------------------------
      // バックグラウンド送信
      // ---------------------------------------------------

      fetch(

        API_URL,

        {

          method: "POST",

          mode: "no-cors",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body: JSON.stringify({

            janCode:
              janCode

          })

        }

      )

      .then(function() {


        console.log(
          "DB登録送信完了：",
          janCode
        );


      })

      .catch(function(error) {


        console.error(
          "DB登録エラー：",
          error
        );


      });

    }


    // =====================================================
    // カメラ起動
    // =====================================================

    function startScanner() {


      if (isScanning) {

        return;

      }


      // ---------------------------------------------------
      // スキャナーが存在しない場合
      // ---------------------------------------------------

      if (!scanner) {

        scanner =
          new Html5Qrcode("reader");

      }


      status.textContent =
        "スキャンしてください";


      const config = {

        fps: 10,

        qrbox: {

          width: 280,

          height: 150

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8

        ]

      };


      // ---------------------------------------------------
      // カメラ開始
      // ---------------------------------------------------

      scanner.start(

        {
          facingMode: "environment"
        },

        config,


        // ================================================
        // JAN読み取り成功
        // ================================================

        function(decodedText, decodedResult) {


          const now =
            Date.now();


          // ------------------------------------------------
          // 同じJANの連続読み取り防止
          // ------------------------------------------------

          if (

            decodedText === lastJanCode &&

            now - lastScanTime <
              DUPLICATE_WAIT

          ) {

            return;

          }


          lastJanCode =
            decodedText;


          lastScanTime =
            now;


          currentJanCode =
            decodedText;


          console.log(
            "JAN読み取り：",
            decodedText
          );


          // ------------------------------------------------
          // 画面表示
          // ------------------------------------------------

          result.textContent =
            decodedText;


          status.textContent =
            "登録処理中...";


          // ------------------------------------------------
          // カメラ停止
          // ------------------------------------------------

          isScanning =
            false;


          scanner.stop()

            .then(function() {


              // ==========================================
              // DB登録を開始
              // ==========================================

              registerJanCode(
                currentJanCode
              );


              // ==========================================
              // すぐ次のスキャンへ
              // ==========================================

function onScanSuccess(
  decodedText,
  decodedResult
) {


  // ===================================================
  // 同じJANなら無視
  // ===================================================

  if (
    decodedText === lastJanCode
  ) {

    return;

  }


  // ===================================================
  // 新しいJAN
  // ===================================================

  lastJanCode =
    decodedText;


  // ===================================================
  // JAN表示
  // ===================================================

  result.textContent =
    decodedText;


  status.textContent =
    "登録処理中...";


  console.log(
    "新しいJAN：",
    decodedText
  );


  // ===================================================
  // DBへ送信
  // ===================================================

  registerJanCode(
    decodedText
  );


  // ===================================================
  // すぐ次の商品を待つ
  // ===================================================

  status.textContent =
    "次の商品をスキャンしてください";

}


            })

            .catch(function(error) {


              console.error(
                "カメラ停止エラー：",
                error
              );


              isScanning =
                false;


              startScanner();


            });


        },


        // ================================================
        // 読み取り途中のエラー
        // ================================================

        function(errorMessage) {

          // 無視

        }

      )

      .then(function() {


        isScanning =
          true;


      })


      .catch(function(error) {


        console.error(
          "カメラ起動エラー：",
          error
        );


        isScanning =
          false;


        status.textContent =
          "カメラを起動できませんでした";


      });

    }


    // =====================================================
    // ライブラリ確認
    // =====================================================

    if (

      typeof Html5Qrcode ===
      "undefined"

    ) {


      status.textContent =
        "バーコードライブラリを読み込めませんでした";


    }

    else {


      status.textContent =
        "バーコードライブラリ読み込みOK";


      // ---------------------------------------------------
      // カメラ開始
      // ---------------------------------------------------

      startScanner();


    }


  </script>


</body>

</html>
