<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>在庫登録</title>

  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 18px;

      min-height: 28px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 26px;

      font-weight: bold;

      word-break: break-all;

    }


    #registerArea {

      display: none;

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      text-align: left;

    }


    .label {

      display: block;

      margin-top: 15px;

      margin-bottom: 5px;

      font-weight: bold;

    }


    input {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      font-size: 18px;

      border: 1px solid #ccc;

      border-radius: 6px;

    }


    #registerButton {

      width: 100%;

      margin-top: 25px;

      padding: 15px;

      font-size: 20px;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

    }

  </style>

</head>


<body>


  <h1>
    在庫登録
  </h1>


  <div id="status">
    カメラを起動しています...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <!-- ========================================= -->
  <!-- 登録エリア -->
  <!-- ========================================= -->

  <div id="registerArea">


    <div>

      <span class="label">
        JANコード
      </span>

      <div id="janDisplay">
      </div>

    </div>


    <div>

      <span class="label">
        商品名
      </span>

      <input
        id="productName"
        type="text"
        placeholder="商品名"
      >

    </div>


    <div>

      <span class="label">
        賞味期限
      </span>

      <input
        id="expiryDate"
        type="date"
      >

    </div>


    <div>

      <span class="label">
        数量
      </span>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

    </div>


    <button
      id="registerButton"
      type="button">

      登録

    </button>


  </div>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // =====================================================
    // HTML要素
    // =====================================================

    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    const registerArea =
      document.getElementById("registerArea");


    const janDisplay =
      document.getElementById("janDisplay");


    const productName =
      document.getElementById("productName");


    const expiryDate =
      document.getElementById("expiryDate");


    const quantity =
      document.getElementById("quantity");


    const registerButton =
      document.getElementById("registerButton");


    // =====================================================
    // 現在読み取ったJAN
    // =====================================================

    let currentJanCode = "";


    // =====================================================
    // 最後に読み取ったJAN
    // =====================================================

    let lastJanCode = "";


    // =====================================================
    // JANコードチェック
    // =====================================================

    function isValidJAN(code) {


      if (
        !/^\d+$/.test(code)
      ) {

        return false;

      }


      // ---------------------------------------------------
      // JAN-13
      // ---------------------------------------------------

      if (
        code.length === 13
      ) {

        let sum = 0;


        for (
          let i = 0;
          i < 12;
          i++
        ) {

          const digit =
            Number(code[i]);


          if (
            i % 2 === 0
          ) {

            sum += digit;

          }

          else {

            sum += digit * 3;

          }

        }


        const checkDigit =
          (10 - (sum % 10)) % 10;


        return (
          checkDigit ===
          Number(code[12])
        );

      }


      // ---------------------------------------------------
      // JAN-8
      // ---------------------------------------------------

      if (
        code.length === 8
      ) {

        let sum = 0;


        for (
          let i = 0;
          i < 7;
          i++
        ) {

          const digit =
            Number(code[i]);


          if (
            i % 2 === 0
          ) {

            sum += digit * 3;

          }

          else {

            sum += digit;

          }

        }


        const checkDigit =
          (10 - (sum % 10)) % 10;


        return (
          checkDigit ===
          Number(code[7])
        );

      }


      return false;

    }


    // =====================================================
    // JAN読み取り成功
    // =====================================================

    function onScanSuccess(
      decodedText,
      decodedResult
    ) {


      // ---------------------------------------------------
      // JANチェック
      // ---------------------------------------------------

      if (
        !isValidJAN(decodedText)
      ) {

        console.log(
          "JANではないため無視：",
          decodedText
        );

        return;

      }


      // ---------------------------------------------------
      // 同じJANを連続検出している場合は無視
      // ---------------------------------------------------

      if (
        decodedText === lastJanCode
      ) {

        return;

      }


      // ---------------------------------------------------
      // JAN確定
      // ---------------------------------------------------

      lastJanCode =
        decodedText;


      currentJanCode =
        decodedText;


      // ---------------------------------------------------
      // 表示
      // ---------------------------------------------------

      result.textContent =
        decodedText;


      janDisplay.textContent =
        decodedText;


      // ---------------------------------------------------
      // 登録エリア表示
      // ---------------------------------------------------

      registerArea.style.display =
        "block";


      // ---------------------------------------------------
      // ステータス
      // ---------------------------------------------------

      status.textContent =
        "登録内容を入力してください";


      // ---------------------------------------------------
      // 商品名にフォーカス
      // ---------------------------------------------------

      productName.focus();


      console.log(
        "JAN読み取り：",
        decodedText
      );

    }


    // =====================================================
    // 読み取り途中のエラー
    // =====================================================

    function onScanFailure(
      errorMessage
    ) {

      // 読み取り途中のエラーは無視

    }


    // =====================================================
    // スキャナー
    // =====================================================

    const scanner =
      new Html5Qrcode("reader");


    // =====================================================
    // 読み取り設定
    // =====================================================

    const config = {

      fps: 10,

      qrbox: {

        width: 280,

        height: 150

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8

      ]

    };


    // =====================================================
    // カメラ起動
    // =====================================================

    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {


      status.textContent =
        "商品をスキャンしてください";


    })

    .catch(function(error) {


      console.error(
        "カメラ起動エラー：",
        error
      );


      status.textContent =
        "カメラを起動できませんでした";

    });


    // =====================================================
    // 登録ボタン
    // =====================================================

    registerButton.addEventListener(
      "click",
      function() {


        // -----------------------------------------------
        // JAN確認
        // -----------------------------------------------

        if (
          !currentJanCode
        ) {

          alert(
            "JANコードがありません"
          );

          return;

        }


        // -----------------------------------------------
        // 賞味期限確認
        // -----------------------------------------------

        if (
          !expiryDate.value
        ) {

          alert(
            "賞味期限を入力してください"
          );

          return;

        }


        // -----------------------------------------------
        // 数量確認
        // -----------------------------------------------

        if (
          !quantity.value ||
          Number(quantity.value) < 1
        ) {

          alert(
            "数量を入力してください"
          );

          return;

        }


        // -----------------------------------------------
        // 今回はまだDB登録しない
        // -----------------------------------------------

        console.log(
          "登録内容",
          {

            janCode:
              currentJanCode,

            productName:
              productName.value,

            expiryDate:
              expiryDate.value,

            quantity:
              quantity.value

          }
        );


        alert(
          "登録内容を確認しました"
        );


      }
    );


  </script>


</body>

</html>
