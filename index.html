<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JANコードテスト</title>


  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

    }


    #status {

      margin: 15px 0;

      font-size: 16px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;

    }

  </style>

</head>


<body>


  <h1>
    JANコード読み取りテスト
  </h1>


  <div id="status">
    起動準備中...
  </div>


  <div id="reader">
  </div>


  <div id="result">
  まだ読み取っていません
</div>


<button id="registerButton"
        style="
          display:none;
          margin-top:20px;
          padding:15px 30px;
          font-size:20px;
        ">

  登録

</button>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");

    const registerButton =
      document.getElementById("registerButton");

    let currentJanCode = "";

    // =====================================================
    // ライブラリ確認
    // =====================================================

    if (typeof Html5Qrcode === "undefined") {

      status.textContent =
        "バーコードライブラリを読み込めませんでした";

    }

    else {

      status.textContent =
        "バーコードライブラリ読み込みOK";

    }


    // =====================================================
    // バーコード読み取り
    // =====================================================

    const scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {

        width: 280,

        height: 150

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8

      ]

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,


      // ===================================================
      // 読み取り成功
      // ===================================================

function(decodedText, decodedResult) {

  console.log(
    "JANコード：",
    decodedText
  );


  currentJanCode =
    decodedText;


  result.textContent =
    decodedText;


  status.textContent =
    "読み取り成功";


  registerButton.style.display =
    "inline-block";


  scanner.stop();

}

      // ===================================================
      // 読み取り失敗
      // ===================================================

      function(errorMessage) {

        // 読み取り途中の失敗は無視

      }

    )


    .catch(function(error) {

      console.error(error);


      status.textContent =
        "カメラを起動できませんでした";

    });


  </script>


</body>

</html>
