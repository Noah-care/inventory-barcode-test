<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>在庫登録</title>

  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 18px;

      min-height: 28px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 26px;

      font-weight: bold;

      word-break: break-all;

    }


    #registerArea {

      display: none;

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      text-align: left;

    }


    .label {

      display: block;

      margin-top: 15px;

      margin-bottom: 5px;

      font-weight: bold;

    }


    input {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      font-size: 18px;

      border: 1px solid #ccc;

      border-radius: 6px;

    }


    #registerButton {

      width: 100%;

      margin-top: 25px;

      padding: 15px;

      font-size: 20px;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

    }

  </style>

</head>


<body>


  <h1>
    在庫登録
  </h1>


  <div id="status">
    カメラを起動しています...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <!-- ========================================= -->
  <!-- 登録エリア -->
  <!-- ========================================= -->

  <div id="registerArea">


    <div>

      <span class="label">
        JANコード
      </span>

      <div id="janDisplay">
      </div>

    </div>


    <div>

      <span class="label">
        商品名
      </span>

      <input
        id="productName"
        type="text"
        placeholder="商品名"
      >

    </div>


    <div>

      <span class="label">
        賞味期限
      </span>

      <input
        id="expiryDate"
        type="date"
      >

    </div>


    <div>

      <span class="label">
        数量
      </span>

      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
      >

    </div>


    <button
      id="registerButton"
      type="button">

      登録

    </button>


  </div>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // =====================================================
    // HTML要素
    // =====================================================

    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    const registerArea =
      document.getElementById("registerArea");


    const janDisplay =
      document.getElementById("janDisplay");


    const productName =
      document.getElementById("productName");


    const expiryDate =
      document.getElementById("expiryDate");


    const quantity =
      document.getElementById("quantity");


    const registerButton =
      document.getElementById("registerButton");


    // =====================================================
    // 現在読み取ったJAN
    // =====================================================

    let currentJanCode = "";


    // =====================================================
    // 最後に読み取ったJAN
    // =====================================================

    let lastJanCode = "";


    // =====================================================
    // JANコードチェック
    // =====================================================

    function isValidJAN(code) {


      if (
        !/^\d+$/.test(code)
      ) {

        return false;

      }


      // ---------------------------------------------------
      // JAN-13
      // ---------------------------------------------------

      if (
        code.length === 13
      ) {

        let sum = 0;


        for (
          let i = 0;
          i < 12;
          i++
        ) {

          const digit =
            Number(code[i]);


          if (
            i % 2 === 0
          ) {

            sum += digit;

          }

          else {

            sum += digit * 3;

          }

        }


        const checkDigit =
          (10 - (sum % 10)) % 10;


        return (
          checkDigit ===
          Number(code[12])
        );

      }


      // ---------------------------------------------------
      // JAN-8
      // ---------------------------------------------------

      if (
        code.length === 8
      ) {

        let sum = 0;


        for (
          let i = 0;
          i < 7;
          i++
        ) {

          const digit =
            Number(code[i]);


          if (
            i % 2 === 0
          ) {

            sum += digit * 3;

          }

          else {

            sum += digit;

          }

        }


        const checkDigit =
          (10 - (sum % 10)) % 10;


        return (
          checkDigit ===
          Number(code[7])
        );

      }


      return false;

    }

// =====================================================
// JAN読み取り成功
// =====================================================

// =====================================================
// JAN読み取り成功
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {


  // ---------------------------------------------------
  // JANチェック
  // ---------------------------------------------------

  if (
    !isValidJAN(decodedText)
  ) {

    console.log(
      "JANではないため無視：",
      decodedText
    );

    return;

  }


  // ---------------------------------------------------
  // 同じJANを連続検出している場合は無視
  // ---------------------------------------------------

  if (
    decodedText === lastJanCode
  ) {

    return;

  }


  // ---------------------------------------------------
  // JAN確定
  // ---------------------------------------------------

  lastJanCode =
    decodedText;


  currentJanCode =
    decodedText;


  // ---------------------------------------------------
  // JAN表示
  // ---------------------------------------------------

  result.textContent =
    decodedText;


  janDisplay.textContent =
    decodedText;


  // ---------------------------------------------------
  // 登録エリア表示
  // ---------------------------------------------------

  registerArea.style.display =
    "block";


  // ---------------------------------------------------
  // 商品名検索中
  // ---------------------------------------------------

  status.textContent =
    "商品情報を確認しています...";


  productName.value =
    "";


  try {


    // =================================================
    // Apps Scriptへ商品検索
    // =================================================

    const response =
      await fetch(

        API_URL +
        "?action=product&janCode=" +
        encodeURIComponent(
          decodedText
        )

      );


    const data =
      await response.json();


    // =================================================
    // 商品発見
    // =================================================

    if (
      data.found
    ) {

      productName.value =
        data.productName || "";


      status.textContent =
        "商品を確認しました";


      console.log(
        "商品マスタ：",
        data.productName
      );

    }


    // =================================================
    // 商品未登録
    // =================================================

    else {

      productName.value =
        "";


      status.textContent =
        "未登録商品です。商品名を入力してください";


      productName.focus();


      console.log(
        "商品マスタにありません：",
        decodedText
      );

    }


  }


  catch (error) {


    // =================================================
    // 商品検索エラー
    // =================================================

    console.error(
      "商品検索エラー：",
      error
    );


    status.textContent =
      "商品情報を取得できませんでした";


    productName.focus();

  }

}



    

    // =====================================================
    // 読み取り途中のエラー
    // =====================================================

    function onScanFailure(
      errorMessage
    ) {

      // 読み取り途中のエラーは無視

    }


    // =====================================================
    // スキャナー
    // =====================================================

    const scanner =
      new Html5Qrcode("reader");


    // =====================================================
    // 読み取り設定
    // =====================================================

    const config = {

      fps: 10,

      qrbox: {

        width: 280,

        height: 150

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8

      ]

    };


    // =====================================================
    // カメラ起動
    // =====================================================

    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {


      status.textContent =
        "商品をスキャンしてください";


    })

    .catch(function(error) {


      console.error(
        "カメラ起動エラー：",
        error
      );


      status.textContent =
        "カメラを起動できませんでした";

    });


    // =====================================================
    // 登録ボタン
    // =====================================================

    // =====================================================
// Apps Script Webアプリ
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyErStqYsz6WsJw7VvZFYyBr3DAYlOyDSAcX7oTLgvQMz4JLLHKTgCaiafm4CnxE1Pr/exec";


// =====================================================
// 登録ボタン
// =====================================================

registerButton.addEventListener(
  "click",
  async function() {


    // ---------------------------------------------------
    // JAN確認
    // ---------------------------------------------------

    if (!currentJanCode) {

      alert(
        "JANコードがありません"
      );

      return;

    }


    // ---------------------------------------------------
    // 賞味期限確認
    // ---------------------------------------------------

    if (!expiryDate.value) {

      alert(
        "賞味期限を入力してください"
      );

      return;

    }


    // ---------------------------------------------------
    // 数量確認
    // ---------------------------------------------------

    if (
      !quantity.value ||
      Number(quantity.value) < 1
    ) {

      alert(
        "数量を入力してください"
      );

      return;

    }


    // ---------------------------------------------------
    // 登録ボタンを一時停止
    // ---------------------------------------------------

    registerButton.disabled =
      true;


    registerButton.textContent =
      "登録中...";


    status.textContent =
      "登録しています...";


    try {


      // -------------------------------------------------
      // Apps Scriptへ送信
      // -------------------------------------------------

      await fetch(

        API_URL,

        {

          method: "POST",

          mode: "no-cors",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body: JSON.stringify({

            janCode:
              currentJanCode,

            productName:
              productName.value,

            expiryDate:
              expiryDate.value,

            quantity:
              Number(quantity.value)

          })

        }

      );


      // -------------------------------------------------
      // 登録完了
      // -------------------------------------------------

      status.textContent =
        "登録しました";


      alert(
        "登録しました"
      );


      console.log(
        "登録完了：",
        currentJanCode
      );


      // -------------------------------------------------
      // 入力欄クリア
      // -------------------------------------------------

      productName.value =
        "";

      expiryDate.value =
        "";

      quantity.value =
        1;


      // -------------------------------------------------
      // 次の商品へ
      // -------------------------------------------------

      currentJanCode =
        "";

      lastJanCode =
        "";


      janDisplay.textContent =
        "";


      result.textContent =
        "次の商品を読み取ってください";


      registerArea.style.display =
        "none";


      status.textContent =
        "次の商品をスキャンしてください";


    }


    catch (error) {


      // -------------------------------------------------
      // 登録エラー
      // -------------------------------------------------

      console.error(
        "登録エラー：",
        error
      );


      status.textContent =
        "登録に失敗しました";


      alert(
        "登録に失敗しました"
      );

    }


    finally {


      // -------------------------------------------------
      // 登録ボタン復帰
      // -------------------------------------------------

      registerButton.disabled =
        false;


      registerButton.textContent =
        "登録";

    }

  }
);


  </script>


</body>

</html>
