<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JANコード自動登録</title>


  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 18px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;

    }

  </style>

</head>


<body>


  <h1>
    JANコード自動登録
  </h1>


  <div id="status">
    起動準備中...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // =====================================================
    // HTML要素
    // =====================================================

    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    // 読み取ったJANコード

    let currentJanCode = "";


    // =====================================================
    // Apps Script Webアプリ
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyErStqYsz6WsJw7VvZFYyBr3DAYlOyDSAcX7oTLgvQMz4JLLHKTgCaiafm4CnxE1Pr/exec";


    // =====================================================
    // JANコード登録
    // =====================================================

    async function registerJanCode() {


      // ---------------------------------------------------
      // JANコード確認
      // ---------------------------------------------------

      if (!currentJanCode) {

        status.textContent =
          "JANコードがありません";

        return;

      }


      // ---------------------------------------------------
      // 登録開始
      // ---------------------------------------------------

      status.textContent =
        "登録中...";


      try {


        // -------------------------------------------------
        // Apps Scriptへ送信
        // -------------------------------------------------

        await fetch(

          API_URL,

          {

            method: "POST",

            mode: "no-cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              janCode:
                currentJanCode

            })

          }

        );


        // -------------------------------------------------
        // 登録完了
        // -------------------------------------------------

        status.textContent =
          "登録しました";


        console.log(
          "登録JAN：",
          currentJanCode
        );


      }


      catch (error) {


        console.error(
          "登録エラー：",
          error
        );


        status.textContent =
          "登録に失敗しました";


      }

    }


    // =====================================================
    // バーコードライブラリ確認
    // =====================================================

    if (
      typeof Html5Qrcode === "undefined"
    ) {


      status.textContent =
        "バーコードライブラリを読み込めませんでした";


    }


    else {


      status.textContent =
        "バーコードライブラリ読み込みOK";


      // ===================================================
      // スキャナー作成
      // ===================================================

      const scanner =
        new Html5Qrcode("reader");


      // ===================================================
      // 読み取り設定
      // ===================================================

      const config = {

        fps: 10,

        qrbox: {

          width: 280,

          height: 150

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8

        ]

      };


      // ===================================================
      // カメラ起動
      // ===================================================

      scanner.start(

        {
          facingMode: "environment"
        },

        config,


        // ================================================
        // 読み取り成功
        // ================================================

        function(decodedText, decodedResult) {


          console.log(
            "JANコード：",
            decodedText
          );


          // ------------------------------------------------
          // JANコードを保持
          // ------------------------------------------------

          currentJanCode =
            decodedText;


          // ------------------------------------------------
          // 画面表示
          // ------------------------------------------------

          result.textContent =
            decodedText;


          status.textContent =
            "読み取り成功";


          // ------------------------------------------------
          // カメラ停止
          // ------------------------------------------------

          scanner.stop();


          // ------------------------------------------------
          // 自動登録
          // ------------------------------------------------

          registerJanCode();


        },


        // ================================================
        // 読み取り途中のエラー
        // ================================================

        function(errorMessage) {

          // 読み取り途中のエラーは無視

        }

      )


      // ===================================================
      // カメラ起動エラー
      // ===================================================

      .catch(function(error) {


        console.error(
          "カメラ起動エラー：",
          error
        );


        status.textContent =
          "カメラを起動できませんでした";


      });


    }


  </script>


</body>

</html>
