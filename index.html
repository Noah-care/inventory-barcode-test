<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JANコード在庫登録</title>


  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 18px;

      min-height: 28px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;

    }

  </style>

</head>


<body>


  <h1>
    JANコード在庫登録
  </h1>


  <div id="status">
    起動準備中...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


<script>

  // =====================================================
  // HTML要素
  // =====================================================

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");


  // =====================================================
  // Apps Script Webアプリ
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyErStqYsz6WsJw7VvZFYyBr3DAYlOyDSAcX7oTLgvQMz4JLLHKTgCaiafm4CnxE1Pr/exec";


  // =====================================================
  // 最後に登録したJAN
  // =====================================================

  let lastJanCode = "";


  // =====================================================
  // JANコード登録
  // =====================================================

  function registerJanCode(janCode) {

    console.log(
      "DB登録開始：",
      janCode
    );


    fetch(

      API_URL,

      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body: JSON.stringify({

          janCode:
            janCode

        })

      }

    )

    .then(function() {

      console.log(
        "DB送信完了：",
        janCode
      );

    })

    .catch(function(error) {

      console.error(
        "DB登録エラー：",
        error
      );

    });

  }


  // =====================================================
  // JANコードチェック
  // =====================================================

  function isValidJAN(code) {


    // ---------------------------------------------------
    // 数字だけか確認
    // ---------------------------------------------------

    if (
      !/^\d+$/.test(code)
    ) {

      return false;

    }


    // ---------------------------------------------------
    // JAN-13
    // ---------------------------------------------------

    if (
      code.length === 13
    ) {

      let sum = 0;


      for (
        let i = 0;
        i < 12;
        i++
      ) {

        const digit =
          Number(code[i]);


        if (
          i % 2 === 0
        ) {

          sum += digit;

        }

        else {

          sum += digit * 3;

        }

      }


      const checkDigit =
        (10 - (sum % 10)) % 10;


      return (
        checkDigit ===
        Number(code[12])
      );

    }


    // ---------------------------------------------------
    // JAN-8
    // ---------------------------------------------------

    if (
      code.length === 8
    ) {

      let sum = 0;


      for (
        let i = 0;
        i < 7;
        i++
      ) {

        const digit =
          Number(code[i]);


        if (
          i % 2 === 0
        ) {

          sum += digit * 3;

        }

        else {

          sum += digit;

        }

      }


      const checkDigit =
        (10 - (sum % 10)) % 10;


      return (
        checkDigit ===
        Number(code[7])
      );

    }


    // ---------------------------------------------------
    // JAN-13 / JAN-8 以外
    // ---------------------------------------------------

    return false;

  }


  // =====================================================
  // スキャナー作成
  // =====================================================

  const scanner =
    new Html5Qrcode("reader");


  // =====================================================
  // 読み取り設定
  // =====================================================

  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 150

    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8

    ]

  };


  // =====================================================
  // JAN読み取り成功
  // =====================================================

  function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    !isValidJAN(decodedText)
  ) {

    console.log(
      "JANではないため無視：",
      decodedText
    );

    return;

  }


  if (
    decodedText === lastJanCode
  ) {

    return;

  }


  lastJanCode =
    decodedText;


  result.textContent =
    decodedText;


  status.textContent =
    "読み取り完了";


  console.log(
    "JAN確定：",
    decodedText
  );


  registerJanCode(
    decodedText
  );


  setTimeout(

    function() {

      status.textContent =
        "次の商品をスキャンしてください";

    },

    300

  );

}


  // =====================================================
  // 読み取り途中のエラー
  // =====================================================

  function onScanFailure(
    errorMessage
  ) {

    // 読み取り途中のエラーは無視

  }


  // =====================================================
  // カメラ起動
  // =====================================================

  if (

    typeof Html5Qrcode ===
    "undefined"

  ) {

    status.textContent =
      "バーコードライブラリを読み込めませんでした";

  }

  else {

    status.textContent =
      "カメラを起動しています...";


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      status.textContent =
        "スキャンしてください";

    })

    .catch(function(error) {

      console.error(
        "カメラ起動エラー：",
        error
      );


      status.textContent =
        "カメラを起動できませんでした";

    });

  }

</script>


</body>

</html>
