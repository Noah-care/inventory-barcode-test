<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JANコード読み取りテスト</title>


  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #status {

      margin: 15px 0;

      font-size: 16px;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;

    }


    #registerButton {

      display: none;

      margin-top: 20px;

      padding: 15px 30px;

      font-size: 20px;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

    }

  </style>

</head>


<body>


  <h1>
    JANコード読み取りテスト
  </h1>


  <div id="status">
    起動準備中...
  </div>


  <div id="reader">
  </div>


  <div id="result">
    まだ読み取っていません
  </div>


  <button id="registerButton">

    登録

  </button>


  <!-- ========================================= -->
  <!-- バーコード読み取りライブラリ -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>

    // =====================================================
    // HTML要素
    // =====================================================

    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    const registerButton =
      document.getElementById("registerButton");


    // 読み取ったJANコードを保持

    let currentJanCode = "";


    // =====================================================
    // ライブラリ確認
    // =====================================================

    if (
      typeof Html5Qrcode === "undefined"
    ) {

      status.textContent =
        "バーコードライブラリを読み込めませんでした";

    }

    else {

      status.textContent =
        "バーコードライブラリ読み込みOK";


      // ===================================================
      // スキャナー作成
      // ===================================================

      const scanner =
        new Html5Qrcode("reader");


      // ===================================================
      // 読み取り設定
      // ===================================================

      const config = {

        fps: 10,

        qrbox: {

          width: 280,

          height: 150

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8

        ]

      };


      // ===================================================
      // カメラ起動
      // ===================================================

      scanner.start(

        {
          facingMode: "environment"
        },

        config,


        // ================================================
        // 読み取り成功
        // ================================================

        function(decodedText, decodedResult) {


          console.log(
            "JANコード：",
            decodedText
          );


          // JANコードを保持

          currentJanCode =
            decodedText;


          // 画面表示

          result.textContent =
            decodedText;


          status.textContent =
            "読み取り成功";


          // 登録ボタン表示

          registerButton.style.display =
            "inline-block";


          // カメラ停止

          scanner.stop();


        },


        // ================================================
        // 読み取り途中のエラー
        // ================================================

        function(errorMessage) {

          // 読み取り途中のエラーは無視

        }

      )


      // ===================================================
      // カメラ起動エラー
      // ===================================================

      .catch(function(error) {


        console.error(
          "カメラ起動エラー：",
          error
        );


        status.textContent =
          "カメラを起動できませんでした";


      });


    }


    // =====================================================
    // 登録ボタン
    // =====================================================

    registerButton.addEventListener(

      "click",

      function() {


        console.log(
          "登録するJANコード：",
          currentJanCode
        );


        status.textContent =
          "登録処理は次のステップで追加します";


      }

    );


  </script>


</body>

</html>
